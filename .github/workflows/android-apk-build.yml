name: Production Android APK Build (Toolkit Integrated)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android-app
          # Download gradle wrapper if gradlew script is missing
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-betting-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
