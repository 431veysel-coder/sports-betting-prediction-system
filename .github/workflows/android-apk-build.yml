name: Production Android APK Build (Clean)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Clean)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd android-app
          gradle :app:assembleDebug --stacktrace --no-build-cache --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-betting-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
