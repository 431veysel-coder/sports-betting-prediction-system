name: Production Android APK Build (Clean)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Clean)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Source Files
        run: |
          echo "=== MainActivity.kt line 17 ==="
          sed -n '17p' android-app/app/src/main/java/com/openminis/betting/app/MainActivity.kt
          echo "=== MainActivity.kt line 35 ==="
          sed -n '35p' android-app/app/src/main/java/com/openminis/betting/app/MainActivity.kt
          echo "=== Models.kt first 5 lines ==="
          head -5 android-app/app/src/main/java/com/openminis/betting/app/model/Models.kt
          echo "=== DataRepository.kt first 5 lines ==="
          head -5 android-app/app/src/main/java/com/openminis/betting/app/data/DataRepository.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Android APK
        run: |
          cd android-app
          gradle :app:assembleDebug --stacktrace --no-build-cache --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-betting-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk