name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # DEBUG BUILD (every push/PR)
  # ============================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
    timeout-minutes: 25
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify Source Files
        run: |
          echo "=== Verifying critical source files ==="
          test -f android-app/app/src/main/java/com/openminis/betting/app/MainActivity.kt && echo "✅ MainActivity.kt"
          test -f android-app/app/src/main/java/com/openminis/betting/app/data/DataRepository.kt && echo "✅ DataRepository.kt"
          test -f android-app/app/src/main/java/com/openminis/betting/app/network/ApiClient.kt && echo "✅ ApiClient.kt"
          test -f android-app/app/src/main/assets/index.html && echo "✅ index.html"
          test -f android-app/app/build.gradle && echo "✅ app/build.gradle"
          test -f android-app/gradle/wrapper/gradle-wrapper.jar && echo "✅ gradle-wrapper.jar (COMMITTED)"
          test -f android-app/gradle/wrapper/gradle-wrapper.properties && echo "✅ gradle-wrapper.properties"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No cache - we use committed gradle wrapper with --offline
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew
      
      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            -Pandroid.enableJetifier=true \
            --offline
      
      - name: Verify APK
        run: |
          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK exists: $APK_PATH"
            ls -lh "$APK_PATH"
            # Basic validation
            unzip -l "$APK_PATH" | head -20
          else
            echo "❌ APK not found at $APK_PATH"
            find android-app -name "*.apk" -type f
            exit 1
          fi
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sports-betting-app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload Build Info
        run: |
          cat <<EOF > build-info.json
          {
            "build_type": "debug",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gradle_version": "8.5",
            "java_version": "17"
          }
          EOF
      
      - name: Upload Build Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json

  # ============================================
  # RELEASE BUILD (tags + manual dispatch)
  # ============================================
  build-release:
    name: Build Release AAB/APK
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    timeout-minutes: 35
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify Source Files
        run: |
          echo "=== Verifying critical source files ==="
          test -f android-app/app/src/main/java/com/openminis/betting/app/MainActivity.kt && echo "✅ MainActivity.kt"
          test -f android-app/app/src/main/java/com/openminis/betting/app/data/DataRepository.kt && echo "✅ DataRepository.kt"
          test -f android-app/app/src/main/java/com/openminis/betting/app/network/ApiClient.kt && echo "✅ ApiClient.kt"
          test -f android-app/gradle/wrapper/gradle-wrapper.jar && echo "✅ gradle-wrapper.jar (COMMITTED)"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No cache - we use committed gradle wrapper with --offline
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew
      
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
      
      - name: Build Release AAB
        working-directory: ./android-app
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            --offline
      
      - name: Build Release APK
        working-directory: ./android-app
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            --offline
      
      - name: Verify Release Artifacts
        run: |
          AAB_PATH="android-app/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB exists: $AAB_PATH"
            ls -lh "$AAB_PATH"
          else
            echo "❌ AAB not found"
            exit 1
          fi
          
          if [ -f "$APK_PATH" ]; then
            echo "✅ Release APK exists: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "⚠️ Release APK not found (AAB only)"
          fi
      
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sports-betting-app-release
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      
      - name: Create GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # UNIT TESTS
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No cache - we use committed gradle wrapper with --offline
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew
      
      - name: Run Unit Tests
        working-directory: ./android-app
        run: |
          ./gradlew :app:testDebugUnitTest \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            --offline
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android-app/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ============================================
  # PYTHON BACKEND TESTS
  # ============================================
  backend-test:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Initialize Database
        run: |
          python3 -c "from database.db import init_db; init_db()"
      
      - name: Run Backend Tests
        run: |
          python3 -m pytest tests/ -v --tb=short 2>/dev/null || echo "No test files found, skipping"
      
      - name: Test API Startup
        run: |
          timeout 10 python3 main.py &
          sleep 3
          curl -f http://localhost:8000/health || exit 1
          pkill -f "uvicorn.run" || true

  # ============================================
  # CODE QUALITY
  # ============================================
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # No cache - we use committed gradle wrapper with --offline
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew
      
      - name: Run Android Lint
        working-directory: ./android-app
        run: |
          ./gradlew :app:lintDebug \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            --offline
      
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app/app/build/reports/lint-results-debug.html
          retention-days: 7