<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ayarları - Sports Betting Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚽</span>
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">Betting Intelligence System</h1>
        </div>
        <div class="flex space-x-4">
            <a href="/" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition">Dashboard</a>
            <a href="/settings" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium transition">Settings</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-8">
        <h2 class="text-2xl font-bold text-white mb-6">⚙️ Sistem Ayarları (Zero Hardcoding)</h2>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg divide-y divide-slate-700">
            {% for s in settings %}
            <form action="/settings/update" method="POST" class="py-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <input type="hidden" name="key" value="{{ s.key }}">
                <div class="flex-1">
                    <p class="font-bold text-slate-200">{{ s.key }}</p>
                    <p class="text-xs text-slate-400 mt-1">{{ s.description }} (Kategori: {{ s.category }})</p>
                </div>
                <div class="flex items-center space-x-3 w-full md:w-auto">
                    <input type="text" name="value" value="{{ s.value }}" class="px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 w-full md:w-48">
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition">Güncelle</button>
                </div>
            </form>
            {% endfor %}
        </div>
    </main>
</body>
</html>
